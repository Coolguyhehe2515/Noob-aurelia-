name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lazurite==0.12.0
      - name: Shaderc
        run: |
          mkdir -p tools
          curl -fL -o tools/shaderc https://github.com/devendrn/newb-shader/releases/download/dev/shaderc-linux-x64
          chmod +x tools/shaderc
      - name: Mark metal textures
        run: |
          pip install pillow
          python mark_metal.py
      - name: Vanilla materials
        run: |
          curl -fL -o mats.zip https://github.com/Coolguyhehe2515/Noob-aurelia-/releases/download/26.60_support/src-materials-26.60.zip
          mkdir -p vanilla tmp
          unzip -q mats.zip -d tmp
          find tmp -name '*.material.json' -exec mv {} vanilla/ \;
          ls vanilla
      - run: python build.py
      - run: ls pack/renderer/materials
      - uses: actions/upload-artifact@v4
        with:
          name: noob-aurelia
          path: pack/
